name: Build Victoria Launcher Release APK
on:
  workflow_dispatch: # 允许手动触发构建（在Actions页面点按钮运行）
  push:
    branches: [ main ] # 每次提交代码自动触发构建

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 给release启用debug签名，解决release必须签名的报错
      - name: Patch build.gradle to use debug signing for release
        run: |
          sed -i '/buildTypes {/a \
              release { \
                  signingConfig signingConfigs.debug \
              }' app/build.gradle

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: victoria-hacked-zh-release-apk
          path: app/build/outputs/apk/release/app-release.apk
