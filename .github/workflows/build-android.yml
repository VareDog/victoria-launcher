name: Build Victoria Launcher Release APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 直接在构建命令传参数：release 使用debug签名，不用修改build.gradle文件！
      - name: Build Release APK (debug signing)
        run: ./gradlew assembleRelease -Pandroid.injected.signing.store.file=$HOME/.android/debug.keystore -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=androiddebugkey -Pandroid.injected.signing.key.password=android

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: victoria-hacked-zh-release-apk
          path: app/build/outputs/apk/release/app-release.apk
